{% extends "base.html" %}

{% block titulo %}
{{ producto.nombre }}
{% endblock %}

{% block contenido %}

<h2>{{ producto.nombre }}</h2>

<img
    src="{{ url_for('static', filename=producto.foto) }}"
    alt="{{ producto.nombre }}"
>

<p><strong>Marca:</strong> {{ producto.marca }}</p>

<p><strong>SKU:</strong> {{ producto.sku }}</p>

<p><strong>Precio:</strong> ${{ producto.precio }}</p>

<a href="{{ url_for('main.index') }}">
    ← Volver al catálogo
</a>

{% endblock %}
